name: Scientific software

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform:
    name: Tests and synthetic smoke (${{ matrix.os }})
    concurrency:
      group: scientific-software-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify the sealed presentation
        if: runner.os == 'Linux'
        run: python -I scripts/present_demo.py --verify-only
      - name: Install the locked environment manager
        run: python -m pip install uv==0.11.15
      - name: Install the locked project environment
        run: uv sync --dev --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Run the complete test suite
        run: uv run pytest
      - name: Run the public synthetic workflow in an isolated registry
        run: >-
          uv run histo-audit experiment smoke
          --runs-root artifacts/ci-smoke-runs
