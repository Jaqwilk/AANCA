name: Scientific software

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scientific-software-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reviewer:
    name: Reviewer checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out the lightweight review materials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check the article and upstream sources without dependencies
        run: python -I scripts/review_project.py --json --report artifacts/qa/reviewer-check.json
      - name: Build and check a freshly extracted offline kit
        run: >-
          python -I scripts/build_reviewer_kit.py
          --output-dir artifacts/qa/reviewer-kit --verify-extracted
      - name: Install only the optional numeric reviewer dependency
        run: python -m pip install --disable-pip-version-check -r requirements-reviewer.txt
      - name: Independently recalculate the saved external evidence
        run: python -I scripts/review_project.py --numeric --json --report artifacts/qa/numeric-readback.json
      - name: Retain reviewer receipts and kit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewer-${{ matrix.os }}
          path: |
            artifacts/qa/reviewer-check.json
            artifacts/qa/numeric-readback.json
            artifacts/qa/reviewer-kit/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  cross-platform:
    name: Full tests (${{ matrix.os }}, shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [0, 1]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          lfs: true
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the locked environment manager
        run: python -m pip install uv==0.11.15
      - name: Install the locked project environment
        run: uv sync --dev --frozen
      - name: Lint
        if: matrix.shard == 0
        run: uv run ruff check .
      - name: Check formatting
        if: matrix.shard == 0
        run: uv run ruff format --check .
      - name: Type check
        if: runner.os == 'Windows' && matrix.shard == 0
        run: uv run mypy src
      - name: Execute this full-suite partition and record actual outcomes
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/qa/ci
          uv run pytest --durations=20 --junitxml=artifacts/qa/ci/junit.xml \
            --aanca-shard-count=2 --aanca-shard-index=${{ matrix.shard }} \
            --aanca-shard-manifest=artifacts/qa/ci/pytest-shard-${{ matrix.shard }}.json \
            2>&1 | tee artifacts/qa/ci/pytest.log
      - name: Run the public synthetic workflow in an isolated registry
        if: matrix.shard == 0
        run: >-
          uv run histo-audit experiment smoke
          --runs-root artifacts/ci-smoke-runs
      - name: Retain test outcomes and profiling evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-receipts-${{ matrix.os }}-${{ matrix.shard }}
          path: artifacts/qa/ci/
          if-no-files-found: error
          retention-days: 30

  complete-coverage:
    name: Complete Ubuntu and Windows coverage
    needs: [reviewer, cross-platform]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the coverage verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download every full-suite execution receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-receipts-*
          path: artifacts/qa/downloaded
      - name: Require disjoint and exhaustive successful execution on both platforms
        run: >-
          python -I scripts/verify_test_shards.py artifacts/qa/downloaded
          --platform Linux --platform Windows --shard-count 2
          --revision ${{ github.sha }}
      - name: Require all reviewer, quality and synthetic gates
        env:
          REVIEWER_RESULT: ${{ needs.reviewer.result }}
          FULL_RESULT: ${{ needs.cross-platform.result }}
        run: >-
          python -c "import os; assert os.environ['REVIEWER_RESULT'] == 'success'
          and os.environ['FULL_RESULT'] == 'success', 'A required job failed or was cancelled'"
