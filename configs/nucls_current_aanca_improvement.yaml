  require_strict_success_in_every_declared_subset: true
  permit_posthoc_replacement_of_frozen_result: false
retraining_guard:
  evidence_role: independent_group_validation
  primary_metric: macro_f1
  bootstrap_iterations: 2000
  bootstrap_seed: 26082071
  minimum_macro_f1_effect: 0.0
  action_when_not_strictly_positive: retain_uncorrected
  automatic_source_annotation_modification: false
